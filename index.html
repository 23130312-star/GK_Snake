<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="sidebar">
        <h1>SNAKE GAME</h1>

        <div class="level-list">
            <button class="level active">Level 1</button>
            <button class="level">Level 2</button>
            <button class="level">Level 3</button>
            <button class="level">Level 4</button>
            <button class="level">Level 5</button>
            <button class="level">Level 6</button>
        </div>
    </div>

    <div class="game-container">


        <div class="game-info">

            <div class="level-info">
                <h3 id="level-title">LEVEL 1</h3>
                <p id="level-description">Xuyên tường</p>
            </div>

            <div class="score-info">
                <h4>SCORE</h4>
                <p id="score">0</p>
            </div>

            <div class="food-info">
                <h4>MỤC TIÊU</h4>
                <p>🍎 <span id="food-count">0</span>/5</p>
            </div>

            <button id="pause-btn">Ⅱ</button>

        </div>


        <div id="game-board"></div>

        <div class="game-footer">
            <p>Điều khiển: Phím mũi tên ← ↑ ↓ →</p>
            <p>Ăn đủ 5 trái cây để qua màn</p>
        </div>

    </div>

</div>

<script src="game.js"></script>
</body>
</html>
