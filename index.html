<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Snake</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

<main class="game">

    <section class="menu" id="mainMenu">

        <div class="menu__header">
            <h1 class="menu__title">SNAKE</h1>
            <p class="menu__subtitle">CLASSIC</p>
        </div>

        <div class="menu__items">

            <button class="menu__item active" data-action="start">
                <span class="menu__arrow">▶</span>
                NEW GAME
            </button>

            <button class="menu__item" data-action="level">
                <span class="menu__arrow">▶</span>
                LEVEL
            </button>

            <button class="menu__item" data-action="score">
                <span class="menu__arrow">▶</span>
                HIGH SCORE
            </button>

            <button class="menu__item" data-action="help">
                <span class="menu__arrow">▶</span>
                HOW TO PLAY
            </button>

        </div>

        <div class="menu__footer">
            ↑ ↓ SELECT &nbsp;&nbsp; ENTER OK
        </div>

    </section>

</main>

<script src="/js/menu.js"></script>

</body>
</html>
