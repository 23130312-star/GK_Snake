<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="sidebar">
        <h1>SNAKE GAME</h1>

        <div class="level-list">
            <button class="level active" onclick="changeLevel(1)">Level 1</button>
            <button class="level" onclick="changeLevel(2)">Level 2</button>
            <button class="level" onclick="changeLevel(3)">Level 3</button>
            <button class="level" onclick="changeLevel(4)">Level 4</button>
            <button class="level" onclick="changeLevel(5)">Level 5</button>
            <button class="level" onclick="changeLevel(6)">Level 6</button>
        </div>
    </div>

    <div class="game-container">


        <div class="game-info">

            <div class="level-info">
                <h3 id="level-title">Level: 3</h3>
                <p id="level-description">Chướng ngại vật</p>
            </div>

            <div class="score-info">
                <h4>SCORE</h4>
                <p id="score">0</p>
            </div>

            <div class="time-info">
                <h4>TIME</h4>
                <p id="time">01:30</p>
            </div>

            <div class="food-info">
                <h4>MỤC TIÊU</h4>
                <p>🍎 <span id="food-count">0</span>/5</p>
            </div>

            <button id="pause-btn">Ⅱ</button>

        </div>


        <div id="game-board"></div>
        <div id="win-message">
            <h2>LEVEL COMPLETED!</h2>
            <p id="win-text">Bạn đã hoàn thành Level 1</p>
            <p>Score: <span id="final-score">0</span></p>

            <button id="next-btn" onclick="nextLevel()">
                Next Level
            </button>
        </div>
        <div class="game-footer">
            <p>Điều khiển: Phím mũi tên ← ↑ ↓ →</p>
            <p>Ăn đủ 5 trái cây để qua màn</p>
        </div>

    </div>

</div>

<script src="game.js"></script>
</body>
</html>
